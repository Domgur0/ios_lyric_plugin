name: Build Theos Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      THEOS: /home/runner/theos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            git \
            perl \
            clang \
            build-essential \
            ldid \
            xz-utils \
            libplist-utils

      - name: Setup Theos
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --depth 1 https://github.com/theos/theos.git $THEOS
          fi

      - name: Build rootless package
        run: |
          make clean
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=rootless

      - name: Upload rootless artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootless-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Build roothide package
        run: |
          make clean
          make package THEOS=$THEOS THEOS_PACKAGE_SCHEME=roothide

      - name: Upload roothide artifact
        uses: actions/upload-artifact@v4
        with:
          name: roothide-deb
          path: packages/*.deb
          if-no-files-found: error
